# =================================================================
# 1. FONTS (Nerd Font required for symbols)
# =================================================================
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        20.0
adjust_line_height  110%
disable_ligatures   never

# =================================================================
# 2. THEME - Modus Tinted (Deutan Optimized)
# =================================================================
# Base
foreground #0a0a0a
background #fbf7f0

# Cursor (Black Block = Max visibility)
cursor #000000
cursor_text_color #ffffff
cursor_shape block
cursor_blink_interval 0

# Selection (Sand/Yellow - Safe from R/G confusion)
selection_foreground #000000
selection_background #f5d0a9

# URLs (Blue)
url_color #005faf
url_style curly

# =================================================================
# 3. ANSI COLORS
# =================================================================
# Black
color0 #000000
color8 #595959

# Red (Kept for compatibility, high contrast)
color1 #a60000
color9 #972500

# Green (Dark, luminance contrast)
color2 #005e00
color10 #316500

# Yellow (Brown/Gold - Safe warning color)
color3 #813e00
color11 #70480f

# Blue (PRIMARY ANCHOR COLOR)
color4 #0031a9
color12 #2544bb

# Magenta
color5 #721045
color13 #5317ac

# Cyan
color6 #005e8b
color14 #005a5f

# White
color7 #bfbfbf
color15 #ffffff

# =================================================================
# 4. WINDOW / MISC
# =================================================================
window_padding_width 10
scrollback_lines 10000
enable_audio_bell no

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
