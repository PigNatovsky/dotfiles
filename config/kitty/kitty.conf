# =================================================================
# 1. FONTS (Nerd Font required)
# =================================================================
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
adjust_line_height  110%
disable_ligatures   never

# =================================================================
# 2. THEME (Modus Tinted - Deutan Optimized)
# =================================================================
include ./theme.conf
# =================================================================
# 3. WINDOW UI
# =================================================================
window_padding_width 10
scrollback_lines 10000
enable_audio_bell no
# 'Splits' allows arbitrary vertical/horizontal divisions
enabled_layouts splits:default, stack

# =================================================================
# 4. KEYMAPS (Vim Style: Ctrl+Shift + HJKL)
# =================================================================
clear_all_shortcuts no

# --- SYSTEM ---
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+f5 load_config_file
map ctrl+shift+s show_scrollback

# --- NAVIGATION (Focus) ---
map ctrl+shift+h neighboring_window left
map ctrl+shift+l neighboring_window right
map ctrl+shift+k neighboring_window up
map ctrl+shift+j neighboring_window down

# --- MOVE WINDOWS ---
map ctrl+shift+alt+h move_window left
map ctrl+shift+alt+l move_window right
map ctrl+shift+alt+k move_window up
map ctrl+shift+alt+j move_window down

# --- SPLITS ---
# Auto split
map ctrl+shift+enter launch --cwd=current --location=split
# Vertical Split (Side-by-side)
map ctrl+shift+\ launch --location=vsplit --cwd=current
# Horizontal Split (Top-bottom)
map ctrl+shift+minus launch --location=hsplit --cwd=current

# --- WINDOW MANAGEMENT ---
map ctrl+shift+w close_window
map ctrl+shift+z toggle_layout stack  # Zen Mode (Zoom)

# --- RESIZE (Arrows) ---
map ctrl+shift+up resize_window taller
map ctrl+shift+down resize_window shorter
map ctrl+shift+left resize_window narrower
map ctrl+shift+right resize_window wider

# --- TABS ---
map ctrl+shift+t new_tab
map ctrl+shift+q close_tab
map ctrl+shift+n next_tab
map ctrl+shift+p previous_tab
map ctrl+shift+alt+t set_tab_title
